name: "🐞 Bug"
description: "Something broke or behaves oddly"
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Click-by-click steps
      placeholder: "1) …\n2) …"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected, placeholder: "What should happen?" }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual, placeholder: "What happens instead?" }
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "app version, API, OS/Browser, commit SHA"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["S1 - Blocker", "S2 - High", "S3 - Medium", "S4 - Low"]
    validations: { required: true }
