name: Convert bug to story
on:
  issues:
    types: [labeled]
jobs:
  convert:
    if: github.event.label.name == 'convert-to-story'
    runs-on: ubuntu-latest
    steps:
      - name: Promote bug to story (labels, title tweak)
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const current = issue.labels.map(l => l.name);
            // Remove bug-specific, add story/backlog
            const add = ['story','backlog'];
            const remove = ['bug','triage','convert-to-story'];
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              title: issue.title.replace(/^🐞\s*/,'').replace(/^/,'📘 '),
            });
            await github.rest.issues.removeAllLabels({ ...context.repo, issue_number: issue.number });
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [...new Set([...current.filter(l => !remove.includes(l)), ...add])] });
